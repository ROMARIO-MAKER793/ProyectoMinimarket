<div class="min-h-screen flex bg-slate-50 overflow-hidden">
    <!-- PANEL IZQUIERDO (IMAGEN) -->
    <div class="hidden lg:flex w-1/2 relative shadow-2xl z-10">
        <div class="absolute inset-0 bg-cover bg-center" style="background-image: url('https://images.unsplash.com/photo-1604719312566-8912e9227c6a?q=80&w=1080&auto=format&fit=crop');"></div>
        <div class="absolute inset-0 bg-gradient-to-t from-slate-900 via-indigo-900/80 to-indigo-900/40"></div>
        
        <div class="relative z-10 flex flex-col justify-end px-16 pb-20 text-white w-full">
            <div class="mb-6 inline-flex items-center justify-center w-16 h-16 rounded-2xl bg-white/10 backdrop-blur-md border border-white/20 shadow-xl">
                <i class="bi bi-shop text-3xl text-white"></i>
            </div>
            <h1 class="text-5xl font-bold mb-4 tracking-tight">Nova<span class="text-indigo-400">POS</span></h1>
            <p class="text-lg text-slate-300 font-light leading-relaxed max-w-lg">
                La solución definitiva para el control de inventario y punto de venta. Rápido, seguro y diseñado para tu crecimiento.
            </p>
        </div>
    </div>

    <!-- PANEL DERECHO (FORMULARIO) -->
    <div class="flex w-full lg:w-1/2 justify-center items-center p-6 sm:p-12 bg-white relative">
        <div class="absolute top-0 right-0 -mr-20 -mt-20 w-64 h-64 rounded-full bg-indigo-50 blur-3xl opacity-70"></div>
        <div class="absolute bottom-0 left-0 -ml-20 -mb-20 w-64 h-64 rounded-full bg-blue-50 blur-3xl opacity-70"></div>

        <div class="w-full max-w-md relative z-10">
            <div class="lg:hidden flex items-center gap-2 mb-10 justify-center">
                <div class="bg-indigo-600 p-2 rounded-xl shadow-lg text-white">
                    <i class="bi bi-shop text-xl"></i>
                </div>
                <span class="text-2xl font-bold text-slate-900">Nova<span class="text-indigo-600">POS</span></span>
            </div>

            <div class="mb-10">
                <h2 class="text-3xl font-bold text-slate-900 tracking-tight mb-2">Iniciar sesión</h2>
                <p class="text-slate-500">Ingresa tus credenciales para continuar al panel administrativo.</p>
            </div>

            <form (ngSubmit)="onSubmit()" class="space-y-6">
                <div class="space-y-2">
                    <label class="block text-sm font-semibold text-slate-700">Nombre de Usuario</label>
                    <div class="relative flex items-center">
                        <input type="text" name="username" [(ngModel)]="credenciales.username" autofocus placeholder="Ej. cajero01"
                               class="input-saas w-full pl-11 pr-4 py-3.5 bg-slate-50 border border-slate-200 rounded-xl text-slate-900 text-sm focus:bg-white focus:border-indigo-500 focus:ring-4 focus:ring-indigo-500/10 transition-all outline-none">
                        <i class="bi bi-person icon-saas absolute left-4 text-lg text-slate-400 transition-colors"></i>
                    </div>
                </div>

                <div class="space-y-2">
                    <div class="flex justify-between items-center">
                        <label class="block text-sm font-semibold text-slate-700">Contraseña</label>
                        <a href="#" class="text-sm font-medium text-indigo-600 hover:text-indigo-500 transition-colors">¿Olvidaste tu clave?</a>
                    </div>
                    <div class="relative flex items-center">
                        <input type="password" name="password" [(ngModel)]="credenciales.password" placeholder="••••••••"
                               class="input-saas w-full pl-11 pr-4 py-3.5 bg-slate-50 border border-slate-200 rounded-xl text-slate-900 text-sm focus:bg-white focus:border-indigo-500 focus:ring-4 focus:ring-indigo-500/10 transition-all outline-none">
                        <i class="bi bi-shield-lock icon-saas absolute left-4 text-lg text-slate-400 transition-colors"></i>
                    </div>
                </div>

                <button type="submit" [disabled]="isLoading"
                        class="w-full bg-slate-900 hover:bg-indigo-600 text-white py-3.5 rounded-xl font-semibold transition-all duration-300 shadow-lg hover:shadow-indigo-500/30 flex items-center justify-center gap-2 mt-2 disabled:bg-slate-500">
                    <span>{{ isLoading ? 'Autenticando...' : 'Acceder al Sistema' }}</span> 
                    <i class="bi" [class.bi-arrow-right]="!isLoading" [class.bi-hourglass-split]="isLoading"></i>
                </button>
            </form>

            <div class="mt-12 text-center">
                <p class="text-[11px] text-slate-400 font-semibold uppercase tracking-widest mb-3">Licencia activa para</p>
                <div class="inline-flex items-center justify-center gap-2 px-4 py-2 bg-slate-50 rounded-lg border border-slate-100">
                    <i class="bi bi-building-check text-indigo-600"></i>
                    <p class="text-sm font-bold text-slate-700">BODEGAS FAMILIA S.A.C.</p>
                </div>
            </div>
        </div>
    </div>
</div>
