<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Panel Admin</title>
	
	<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <!-- Tailwind -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Bootstrap Icons SOLO iconos -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

    <!-- SweetAlert -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background-color: #f4f6f9;
        }

</head>
<body>

<div class="flex min-h-screen">

    <!-- SIDEBAR -->
    <div th:replace="~{layaout/sidebar :: sidebar}"></div>

    <!-- CONTENIDO -->
    <main class="flex-1 p-6 overflow-auto">
        <div th:replace="~{${content} :: contenido}"></div>
    </main>

</div>

<!-- JS CRUD -->
<script>
	


function openModal() {
    const modal = document.getElementById('productModal');
    modal.classList.remove('hidden');
    modal.classList.add('flex');
}

function closeModal() {
    const modal = document.getElementById('productModal');
    modal.classList.add('hidden');
    modal.classList.remove('flex');
}

function prepareCreate(){
    document.getElementById('modalTitle').innerText = 'Nuevo Producto';
    document.getElementById('productForm').reset();
    document.getElementById('productId').value = '';
	
	// Limpiar preview de imagen
	 const imagenPreview = document.getElementById('imagenPreview'); 
	 if (imagenPreview) {
	     imagenPreview.src = '';          // limpia la imagen
	     imagenPreview.classList.add('hidden'); // oculta la img
	 }

    openModal();
}

function prepareEdit(id,nombre,precio,stockActual,categoriaId,marcaId,descripcion,imagenUrl){
    document.getElementById('modalTitle').innerText = 'Editar Producto';
    document.getElementById('productId').value = id;
    document.getElementById('nombre').value = nombre;
    document.getElementById('precio').value = precio;
    document.getElementById('stockActual').value = stockActual;
    document.getElementById('categoria').value = categoriaId;
	document.getElementById('marca').value = marcaId;
	document.getElementById('descripcion').value = descripcion;
	
	
	// Mostrar la imagen actual si existe
	const imagenPreview = document.getElementById("imagenPreview");
	if (imagenUrl && imagenPreview) {
	    imagenPreview.src = imagenUrl;
		
	    imagenPreview.style.display = 'block';
	} else if(imagenPreview) {
	    imagenPreview.style.display = 'none';
	}
	
    openModal();
}

function confirmDelete(id){
    Swal.fire({
        title: '¿Eliminar producto?',
        icon: 'warning',
        showCancelButton: true,
        confirmButtonColor: '#d33',
        confirmButtonText: 'Sí, eliminar'
    }).then((result) => {
        if (result.isConfirmed) {
            window.location.href = '/admin/productos/eliminar/' + id;
        }
    });
}

const productForm = document.getElementById("productForm");

if(productForm){productForm.addEventListener("submit", function(e) {


    let nombre = document.getElementById("nombre").value.trim();
    let precio = parseFloat(document.getElementById("precio").value);
    let stock = parseInt(document.getElementById("stockActual").value);
    let categoria = document.getElementById("categoria").value;
    let marca = document.getElementById("marca").value;

    if(nombre === ""){
        e.preventDefault();
        Swal.fire("El nombre es obligatorio");
        return;
    }

    if(isNaN(precio) || precio <= 0){
        e.preventDefault();
        Swal.fire("El precio debe ser mayor a 0");
        return;
    }

    if(isNaN(stock) || stock < 20){
        e.preventDefault();
        Swal.fire("El stock mínimo deber ser 20");
        return;
    }

    if(categoria === ""){
        e.preventDefault();
        Swal.fire("Debe seleccionar una categoría");
        return;
    }

    if(marca === ""){
        e.preventDefault();
        Swal.fire("Debe seleccionar una marca");
        return;
    }

});
}

// PREPARAR CREAR USUARIOS
function prepareCreateUser() {
    document.getElementById('modalTitleUser').innerText = 'Nuevo Usuario';
    document.getElementById('userForm').reset();
    document.getElementById('userId').value = '';
    document.getElementById('userModal').classList.remove('hidden');
}

// PREPARAR EDITAR
function prepareEditUser(id, usuario, habilitado, rolId) {
    document.getElementById('modalTitleUser').innerText = 'Editar Usuario';
    document.getElementById('userId').value = id;
    document.getElementById('usuario').value = usuario;
    document.getElementById('habilitado').value = habilitado;
    document.getElementById('roles').value = rolId; // asigna el select al rol actual
    document.getElementById('contrasena').value = ''; // vacío, solo placeholder
    document.getElementById('confirmarContrasena').value = ''; // también vacío
    document.getElementById('userModal').classList.remove('hidden');
}

// CERRAR MODAL
function closeUserModal() {
    document.getElementById('userModal').classList.add('hidden');
}

// CONFIRMAR ELIMINAR
function confirmDeleteUser(id) {
    Swal.fire({
        title: '¿Desea eliminar este usuario?',
        icon: 'warning',
        showCancelButton: true,
        confirmButtonColor: '#d33',
        cancelButtonColor: '#3085d6',
        confirmButtonText: 'Sí, eliminar',
        cancelButtonText: 'Cancelar'
    }).then((result) => {
        if (result.isConfirmed) {
            window.location.href = '/admin/usuarios/eliminar/' + id;
        }

// VALIDAR FORMULARIO CON SWEETALERT2
const userForm = document.getElementById('userForm');

	if(userForm){userForm.addEventListener('submit', function (e) {

    let usuario = document.getElementById('usuario').value.trim();
    let pass = document.getElementById('contrasena').value;
    let confirmPass = document.getElementById('confirmarContrasena').value;
	
	
    let rol = document.getElementById('roles').value;

    if (!usuario) {
        e.preventDefault();
        Swal.fire('Error', 'El nombre de usuario es obligatorio', 'error');
        return;
    }

    if (!rol) {
        e.preventDefault();
        Swal.fire('Error', 'Seleccione un rol', 'error');
        return;
    }

    if (!pass) {
        e.preventDefault();
        Swal.fire('Error', 'La contraseña es obligatoria', 'error');
        return;
    }
	
	console.log("comparando:", pass, confirmPass);
    if (!confirmPass) {
        e.preventDefault();
        Swal.fire('Error', 'Debe confirmar la contraseña', 'error');
        return;
    }

    if (pass !== confirmPass) {
        e.preventDefault();
        Swal.fire('Error', 'Las contraseñas no coinciden', 'error');
        return;
    }

});
}

//Script para venta

document.addEventListener('DOMContentLoaded', () => {
    const inputBuscar = document.getElementById('buscarProducto');
    const listaProductos = document.getElementById('listaProductos');
    const cuerpoVenta = document.getElementById('cuerpoVenta');
    const totalVentaSpan = document.getElementById('totalVenta');

    if (!inputBuscar || !listaProductos || !cuerpoVenta || !totalVentaSpan) return;

    let productosDisponibles = [];
    let productosEnVenta = [];

    // Inicializar productos desde la tabla
    listaProductos.querySelectorAll('tr').forEach(tr => {
        const btn = tr.querySelector('button');
        const id = btn.dataset.id;
        const nombre = tr.children[0].textContent.trim();
        const precio = parseFloat(tr.children[1].textContent.replace('S/ ', ''));
        const stock = parseInt(tr.children[2].textContent.trim());
        const stockMinimo = 20; // Cambiar si quieres dinámico
        productosDisponibles.push({ id, nombre, precio, stock, stockMinimo });
    });

    // Filtrar productos dinámicamente
    inputBuscar.addEventListener('input', () => {
        const texto = inputBuscar.value.trim().toLowerCase();
        listaProductos.querySelectorAll('tr').forEach(tr => tr.style.display = 'none');
        productosDisponibles.forEach((producto, index) => {
            if (producto.nombre.toLowerCase().includes(texto)) {
                listaProductos.querySelectorAll('tr')[index].style.display = '';
            }
        });
    });

    // Función agregar producto
    window.agregarProducto = (btn) => {
        const id = btn.dataset.id;
        const producto = productosDisponibles.find(p => p.id === id);
        if (!producto) return;

        let prodExistente = productosEnVenta.find(p => p.id === id);
        if (prodExistente) {
            // Solo aumentar si no supera stock
            if (prodExistente.cantidad < producto.stock) prodExistente.cantidad += 1;
        } else {
            productosEnVenta.push({ ...producto, cantidad: 1 });
        }

        renderizarTablaVenta();
    };
	
	//Renderizar Tabla al realizar una venta

	function renderizarTablaVenta() {
	    cuerpoVenta.innerHTML = '';
	    let total = 0;

	    productosEnVenta.forEach((prod, index) => {
	        const subtotal = prod.precio * prod.cantidad;
	        total += subtotal;

	        const tr = document.createElement('tr');

	        // Nombre del producto
	        const tdNombre = document.createElement('td');
	        tdNombre.className = 'px-4 py-2 font-medium text-gray-900';
	        tdNombre.textContent = prod.nombre;

	        // Cantidad con input
	        const tdCantidad = document.createElement('td');
	        tdCantidad.className = 'px-4 py-2';
	        const input = document.createElement('input');
	        input.type = 'number';
	        input.min = 1;
	        input.value = prod.cantidad;
	        input.className = 'w-16 border border-gray-300 rounded px-2 py-1';
	        input.addEventListener('change', e => actualizarCantidad(index, e.target.value));
	        tdCantidad.appendChild(input);

	        // Precio unitario
	        const tdPrecio = document.createElement('td');
	        tdPrecio.className = 'px-4 py-2 font-bold text-green-600';
	        tdPrecio.textContent = `S/ ${prod.precio.toFixed(2)}`;

	        // Subtotal
	        const tdSubtotal = document.createElement('td');
	        tdSubtotal.className = 'px-4 py-2 font-semibold text-gray-800';
	        tdSubtotal.textContent = `S/ ${subtotal.toFixed(2)}`;

	        // Botón eliminar
	        const tdAccion = document.createElement('td');
	        tdAccion.className = 'px-4 py-2 text-center';
	        const btnEliminar = document.createElement('button');
	        btnEliminar.type = 'button';
	        btnEliminar.className = 'bg-red-500 hover:bg-red-600 text-white px-3 py-1 rounded-lg text-sm';
	        btnEliminar.textContent = 'X';
	        btnEliminar.addEventListener('click', () => eliminarProducto(index));
	        tdAccion.appendChild(btnEliminar);

	        // Agregar celdas a la fila
	        tr.appendChild(tdNombre);
	        tr.appendChild(tdCantidad);
	        tr.appendChild(tdPrecio);
	        tr.appendChild(tdSubtotal);
	        tr.appendChild(tdAccion);

	        // Agregar fila a la tabla
	        cuerpoVenta.appendChild(tr);
	    });

	    totalVentaSpan.textContent = total.toFixed(2);
	}

    // Actualizar cantidad
    window.actualizarCantidad = (index, cantidad) => {
        cantidad = parseInt(cantidad);
        if (cantidad < 1) cantidad = 1;
        if (cantidad > productosEnVenta[index].stock) cantidad = productosEnVenta[index].stock;

        productosEnVenta[index].cantidad = cantidad;
        renderizarTablaVenta();
    };

    // Eliminar producto de la venta
    window.eliminarProducto = (index) => {
        productosEnVenta.splice(index, 1);
        renderizarTablaVenta();
    };

    // Confirmar venta
    window.confirmarVenta = async () => {
        if (productosEnVenta.length === 0) {
            Swal.fire({ icon: 'warning', title: 'Atención', text: 'No hay productos para realizar la venta' });
            return;
        }

        // Validar stock antes de enviar
        for (let prod of productosEnVenta) {
            if (prod.cantidad < 1) {
                Swal.fire({ icon: 'error', title: 'Cantidad inválida', text: `La venta de "${prod.nombre}" debe ser al menos 1` });
                return;
            }
            if (prod.cantidad > prod.stock) {
                Swal.fire({ icon: 'error', title: 'Cantidad inválida', text: `El producto "${prod.nombre}" tiene solo ${prod.stock} unidades disponibles` });
                return;
            }
        }

        const { isConfirmed } = await Swal.fire({
            title: '¿Seguro quieres confirmar la venta?',
            icon: 'question',
            showCancelButton: true,
            confirmButtonText: 'Sí, confirmar',
            cancelButtonText: 'Cancelar'
        });

        if (!isConfirmed) return;

        const usuarioIdInput = document.getElementById('usuarioIdInput');
        const usuarioId = parseInt(usuarioIdInput.value);

        const ventaDTO = {
            usuarioId: usuarioId,
            detalles: productosEnVenta.map(p => ({
                idProducto: parseInt(p.id),
                nombreProducto: p.nombre,
                cantidad: p.cantidad,
                precioUnitario: p.precio,
                subtotal: p.precio * p.cantidad
            }))
        };

        const csrfTokenInput = document.querySelector('input[name="_csrf"]');
        const csrfHeaderInput = document.querySelector('input[name="_csrf_header"]');
        const csrfToken = csrfTokenInput ? csrfTokenInput.value : '';
        const csrfHeader = csrfHeaderInput ? csrfHeaderInput.value : 'X-CSRF-TOKEN';

        try {
            const response = await fetch('/admin/ventas/crear', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', [csrfHeader]: csrfToken },
                body: JSON.stringify(ventaDTO)
            });

            if (!response.ok) throw new Error('Error al guardar la venta');

            const data = await response.json();
            console.log('Respuesta del Backend:', data);
		
			
			// Actualizar stock en tabla solo si venta exitosa
			// -----------------------------
			productosEnVenta.forEach(det => {
			    // Obtener la fila del producto en la tabla de búsqueda
			    const trProducto = listaProductos.querySelector(`button[data-id="${det.id}"]`)?.closest('tr');
			    if (trProducto) {
			        const spanStock = trProducto.querySelector('span'); // el <span> con Tailwind que muestra stock
			        if (spanStock) {
			            // Obtener el stock actual de manera segura (solo números)
			            const stockActual = parseInt(spanStock.textContent.replace(/\D/g, '')) || 0;
			            const nuevoStock = stockActual - det.cantidad;

			            // Actualizar visualmente el stock en la tabla
			            spanStock.textContent = nuevoStock >= 0 ? nuevoStock : 0;

			            // Debug: verificar valores
			            console.log('🔹 Producto:', det.nombre, 'Stock anterior:', stockActual, 'Cantidad vendida:', det.cantidad, 'Nuevo stock:', nuevoStock);

			            // Definir stock mínimo (Se puede Ajustar, depende ps)
			            const stockMinimo = 20;

			            // Mostrar alerta si stock < stockMinimo
			            if (nuevoStock < stockMinimo) {
			                console.log('⚠️ Stock bajo detectado:', det.nombre, 'Nuevo stock:', nuevoStock);
			                Swal.fire({
			                    icon: 'warning',
			                    title: 'Stock bajo',
			                    text: `El producto "${det.nombre}" tiene menos de ${stockMinimo} unidades. Reponer pronto.`,
			                    confirmButtonColor: '#f59e0b' // color naranja para alerta
			                });
			            }

			            // Actualizar stock en el arreglo de productosDisponibles
			            const productoObj = productosDisponibles.find(p => p.id === det.id);
			            if (productoObj) productoObj.stock = nuevoStock;
			        }
			    }
			});
		
			// Fin actualización stock
			

            productosEnVenta = [];
            renderizarTablaVenta();

            Swal.fire({ icon: 'success', title: '¡Venta realizada correctamente!', confirmButtonText: 'OK' });

        } catch (error) {
            console.error(error);
            Swal.fire({ icon: 'error', title: 'Error', text: 'Ocurrió un error al realizar la venta. Revisa la consola.' });
        }
    };
});


</script>



<script th:inline="javascript">
document.addEventListener("DOMContentLoaded", function() {

    const ventasData = /*[[${ventasPorMes}]]*/ [];
    const productosData = /*[[${productosMasVendidos}]]*/ [];
    const categoriasData = /*[[${distribucionCategorias}]]*/ [];

    console.log("Ventas:", ventasData);
    console.log("Productos:", productosData);
    console.log("Categorias:", categoriasData);

    // =============================
    // VENTAS POR MES
    // =============================
    if (ventasData.length > 0) {
        new Chart(document.getElementById('salesChart'), {
            type: 'line',
            data: {
                labels: ventasData.map(v => "Mes " + v.mes),
                datasets: [{
                    label: 'Ventas por Mes',
                    data: ventasData.map(v => parseFloat(v.total.toFixed(2))),
                    borderWidth: 2,
                    fill: false
                }]
            }
        });
    }

    // =============================
    // PRODUCTOS MÁS VENDIDOS
    // =============================
    if (productosData.length > 0) {
        new Chart(document.getElementById('productChart'), {
            type: 'bar',
            data: {
                labels: productosData.map(p => p.nombre),
                datasets: [{
                    label: 'Productos más vendidos',
                    data: productosData.map(p => p.cantidad),
                    borderWidth: 1
                }]
            }
        });
    }

    // =============================
    // DISTRIBUCIÓN CATEGORÍAS
    // =============================
    if (categoriasData.length > 0) {
        new Chart(document.getElementById('categoryChart'), {
            type: 'pie',
            data: {
                labels: categoriasData.map(c => c.nombre),
                datasets: [{
                    label: 'Distribución por Categoría',
                    data: categoriasData.map(c => c.cantidad)
                }]
            }
        });
    }

});
</script>
