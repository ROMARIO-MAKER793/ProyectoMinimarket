<div th:fragment="sidebar">

    <aside class="w-64 min-h-screen bg-gray-900 text-white flex flex-col shadow-xl sticky top-0">

        <!-- Logo / Header -->
		<div class="flex items-center gap-4 px-6 py-6 border-b border-gray-100 bg-white">
		    
		    <div class="relative flex items-center justify-center w-12 h-12 rounded-2xl bg-gradient-to-tr from-indigo-600 to-purple-500 shadow-lg shadow-indigo-200/50 transform transition-all duration-300 hover:scale-105 hover:shadow-indigo-300 cursor-pointer group shrink-0">
		        
		        <div class="absolute inset-0 bg-white/20 rounded-2xl transform -skew-x-12 -translate-x-full group-hover:translate-x-full transition-transform duration-700 ease-in-out"></div>
		        
		        <i class="bi bi-shop text-2xl text-white relative z-10 drop-shadow-sm"></i>
		    </div>
		    
		    <div class="flex flex-col justify-center">
		        <span class="text-2xl font-black tracking-tighter leading-none text-transparent bg-clip-text bg-gradient-to-r from-indigo-700 to-purple-600">
		            Nova<span class="font-bold text-slate-800">POS</span>
		        </span>
		        
		        <div class="flex items-center gap-1 mt-1">
		            <span class="w-1.5 h-1.5 rounded-full bg-green-500 animate-pulse"></span>
		            <span class="text-[9px] text-slate-400 font-bold uppercase tracking-widest">
		                Bodegas Familia
		            </span>
		        </div>
		    </div>
		</div>

        <!-- Menú dinámico según rol -->
        <nav class="flex-1 px-4 py-8 space-y-4 text-lg">

            <!-- ================== ADMIN ================== -->
            <div sec:authorize="hasRole('ADMIN')">

                <a th:href="@{/admin/dashboard}"
                   class="flex items-center gap-4 px-4 py-3 rounded-xl hover:bg-white/10 hover:pl-6 transition-all duration-200">
                    <i class="bi bi-speedometer2 text-2xl text-blue-400"></i>
                    <span>Dashboard</span>
                </a>

                <a th:href="@{/admin/productos}"
                   class="flex items-center gap-4 px-4 py-3 rounded-xl hover:bg-white/10 hover:pl-6 transition-all duration-200">
                    <i class="bi bi-box-seam text-2xl text-green-400"></i>
                    <span>Productos</span>
                </a>

                <a th:href="@{/admin/ventas}"
                   class="flex items-center gap-4 px-4 py-3 rounded-xl hover:bg-white/10 hover:pl-6 transition-all duration-200">
                    <i class="bi bi-cart-check text-2xl text-yellow-400"></i>
                    <span>Punto de Venta</span>
                </a>

                <a th:href="@{/admin/usuarios}"
                   class="flex items-center gap-4 px-4 py-3 rounded-xl hover:bg-white/10 hover:pl-6 transition-all duration-200">
                    <i class="bi bi-people-fill text-2xl text-purple-400"></i>
                    <span>Usuarios</span>
                </a>

                <a th:href="@{/admin/reportes}"
                   class="flex items-center gap-4 px-4 py-3 rounded-xl hover:bg-white/10 hover:pl-6 transition-all duration-200">
                    <i class="bi bi-bar-chart-line text-2xl text-pink-400"></i>
                    <span>Reportes</span>
                </a>
				
				<a th:href="@{/admin/ventas/historial}"
                   class="flex items-center gap-4 px-4 py-3 rounded-xl hover:bg-white/10 hover:pl-6 transition-all duration-200">
                    <i class="bi bi-receipt text-2xl text-teal-400"></i>
                    <span>Historial Ventas</span>
                </a>


            </div>

            <!-- ================== USER ================== -->
            <div sec:authorize="hasRole('USER')">

                <a th:href="@{/user/productos}"
                   class="flex items-center gap-4 px-4 py-3 rounded-xl hover:bg-white/10 hover:pl-6 transition-all duration-200">
                    <i class="bi bi-box-seam text-2xl text-green-400"></i>
                    <span>Productos</span>
                </a>

                <a th:href="@{/admin/ventas}"
                   class="flex items-center gap-4 px-4 py-3 rounded-xl hover:bg-white/10 hover:pl-6 transition-all duration-200">
                    <i class="bi bi-cart-check text-2xl text-yellow-400"></i>
                    <span>Ventas</span>
                </a>

            </div>

        </nav>

        <!-- Logout -->
        <form id="logoutForm" th:action="@{/logout}" method="post">
            <input type="hidden"
                   th:name="${_csrf.parameterName}"
                   th:value="${_csrf.token}" />

            <div class="p-6 border-t border-gray-800">
                <button type="button"
                        onclick="confirmarLogout()"
                        class="flex items-center gap-4 px-4 py-3 rounded-xl hover:bg-red-600/80 hover:pl-6 transition-all duration-200 w-full text-left">
                    <i class="bi bi-box-arrow-right text-2xl text-red-400"></i>
                    <span>Cerrar sesión</span>
                </button>
            </div>
        </form>

    </aside>

</div>
