<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>NovaPOS | Panel de Administración</title>
	    
	    <link rel="icon" type="image/svg+xml" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/icons/shop.svg">

    <script src="https://cdn.tailwindcss.com"></script>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <style>
        body { font-family: 'Poppins', sans-serif; }
        /* Efecto sutil para los inputs al enfocarlos */
        .input-saas:focus + .icon-saas { color: #4F46E5; }
    </style>
</head>

<body class="min-h-screen flex bg-slate-50 overflow-hidden">



    <!-- Lado izquierdo con degradé -->
    <div class="hidden lg:flex w-1/2 bg-gradient-to-br from-indigo-600 via-purple-600 to-pink-500 justify-center items-center relative overflow-hidden">
        <div class="text-center text-white p-10">
            <h1 class="text-5xl font-bold mb-4">Bienvenido a Bodegas Familia</h1>
            <p class="text-lg opacity-80">Gestiona tus productos, ventas y usuarios de forma eficiente.</p>

        </div>
    </div>

    <div class="flex w-full lg:w-1/2 justify-center items-center p-6 sm:p-12 bg-white relative">
        
        <div class="absolute top-0 right-0 -mr-20 -mt-20 w-64 h-64 rounded-full bg-indigo-50 blur-3xl opacity-70"></div>
        <div class="absolute bottom-0 left-0 -ml-20 -mb-20 w-64 h-64 rounded-full bg-blue-50 blur-3xl opacity-70"></div>

        <div class="w-full max-w-md relative z-10">

            <div class="lg:hidden flex items-center gap-2 mb-10 justify-center">
                <div class="bg-indigo-600 p-2 rounded-xl shadow-lg text-white">
                    <i class="bi bi-shop text-xl"></i>
                </div>


                <h1 class="text-4xl font-bold text-gray-800">Bodegas Familia</h1>
                <p class="text-gray-500 mt-2">Sistema de Gestión</p>

            </div>

            <form id="loginForm" method="post" th:action="@{/login}" class="space-y-6">

                <div class="space-y-2">
                    <label class="block text-sm font-semibold text-slate-700">Nombre de Usuario</label>
                    <div class="relative flex items-center">
                        <input type="text"
                               name="username"
                               id="username"
                               autofocus
                               placeholder="Ej. cajero01"
                               class="input-saas w-full pl-11 pr-4 py-3.5 bg-slate-50 border border-slate-200 rounded-xl text-slate-900 text-sm focus:bg-white focus:border-indigo-500 focus:ring-4 focus:ring-indigo-500/10 transition-all outline-none">
                        <i class="bi bi-person icon-saas absolute left-4 text-lg text-slate-400 transition-colors"></i>
                    </div>
                </div>

                <div class="space-y-2">
                    <div class="flex justify-between items-center">
                        <label class="block text-sm font-semibold text-slate-700">Contraseña</label>
                        <a href="#" class="text-sm font-medium text-indigo-600 hover:text-indigo-500 transition-colors">¿Olvidaste tu clave?</a>
                    </div>
                    <div class="relative flex items-center">
                        <input type="password"
                               name="password"
                               id="password"
                               placeholder="••••••••"
                               class="input-saas w-full pl-11 pr-4 py-3.5 bg-slate-50 border border-slate-200 rounded-xl text-slate-900 text-sm focus:bg-white focus:border-indigo-500 focus:ring-4 focus:ring-indigo-500/10 transition-all outline-none">
                        <i class="bi bi-shield-lock icon-saas absolute left-4 text-lg text-slate-400 transition-colors"></i>
                    </div>
                </div>

                <div class="flex items-center">
                    <input id="remember-me" name="remember-me" type="checkbox" class="h-4 w-4 rounded border-slate-300 text-indigo-600 focus:ring-indigo-600 cursor-pointer">
                    <label for="remember-me" class="ml-2 block text-sm text-slate-600 cursor-pointer">
                        Mantener sesión iniciada
                    </label>
                </div>

                <button type="submit"
                        class="w-full bg-slate-900 hover:bg-indigo-600 text-white py-3.5 rounded-xl font-semibold transition-all duration-300 shadow-lg hover:shadow-indigo-500/30 flex items-center justify-center gap-2 mt-2">
                    <span>Acceder al Sistema</span> 
                    <i class="bi bi-arrow-right text-lg"></i>
                </button>
            </form>

            <div class="mt-12 text-center">
                <p class="text-[11px] text-slate-400 font-semibold uppercase tracking-widest mb-3">Licencia activa para</p>
                <div class="inline-flex items-center justify-center gap-2 px-4 py-2 bg-slate-50 rounded-lg border border-slate-100">
                    <i class="bi bi-building-check text-indigo-600"></i>
                    <p class="text-sm font-bold text-slate-700">BODEGAS FAMILIA S.A.C.</p>
                </div>
            </div>

        </div>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', function(event) {
            const username = this.username.value.trim();
            const password = this.password.value.trim();

            if (!username || !password) {
                event.preventDefault(); 
                Swal.fire({
                    icon: 'warning',
                    title: 'Campos requeridos',
                    text: !username && !password ? 'Ingrese su usuario y contraseña' :
                          !username ? 'Ingrese su usuario' :
                          'Ingrese su contraseña',
                    confirmButtonColor: '#4F46E5',
                    customClass: {
                        popup: 'rounded-2xl',
                        confirmButton: 'rounded-xl px-6 py-2 font-semibold'
                    }
                });
            }
        });

        const urlParams = new URLSearchParams(window.location.search);
        
        if (urlParams.has('error')) {
            Swal.fire({
                icon: 'error',
                title: 'Acceso Denegado',
                text: 'Usuario o contraseña incorrectos',
                confirmButtonColor: '#4F46E5',
                customClass: {
                    popup: 'rounded-2xl',
                    confirmButton: 'rounded-xl px-6 py-2 font-semibold'
                }
            });
        }

        if (urlParams.has('logout')) {
            Swal.fire({
                icon: 'success',
                title: '¡Hasta pronto!',
                text: 'Has cerrado sesión correctamente.',
                confirmButtonColor: '#4F46E5',
                customClass: {
                    popup: 'rounded-2xl',
                    confirmButton: 'rounded-xl px-6 py-2 font-semibold'
                }
            });
        }
    </script>

</body>
</html>
