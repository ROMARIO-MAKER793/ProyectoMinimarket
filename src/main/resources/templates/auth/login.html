<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Iniciar sesión | Minimarket</title>

    <!-- Tailwind CDN -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Poppins -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">

    <!-- SweetAlert2 -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <style>
        body { font-family: 'Poppins', sans-serif; }
    </style>
</head>

<body class="min-h-screen flex">

    <!-- Lado izquierdo con degradé -->
    <div class="hidden lg:flex w-1/2 bg-gradient-to-br from-indigo-600 via-purple-600 to-pink-500 justify-center items-center relative overflow-hidden">
        <div class="text-center text-white p-10">
            <h1 class="text-5xl font-bold mb-4">Bienvenido a Minimarket</h1>
            <p class="text-lg opacity-80">Gestiona tus productos, ventas y usuarios de forma eficiente.</p>
        </div>
        <!-- Decoración -->
        <div class="absolute -top-20 -right-20 w-72 h-72 bg-purple-300 opacity-20 rounded-full rotate-45"></div>
        <div class="absolute -bottom-20 -left-20 w-72 h-72 bg-pink-300 opacity-20 rounded-full rotate-12"></div>
    </div>

    <!-- Lado derecho con login -->
    <div class="flex w-full lg:w-1/2 justify-center items-center p-10 bg-white">
        <div class="w-full max-w-md">

            <!-- Logo / Título -->
            <div class="text-center mb-10">
                <div class="text-6xl text-indigo-600 mb-3">
                    <i class="bi bi-shop"></i>
                </div>
                <h1 class="text-4xl font-bold text-gray-800">Minimarket</h1>
                <p class="text-gray-500 mt-2">Sistema de Gestión</p>
            </div>

            <!-- Formulario -->
            <form id="loginForm" method="post" th:action="@{/login}" class="space-y-6">

                <!-- Usuario -->
                <div>
                    <label class="block text-base font-medium text-gray-700 mb-2">Usuario</label>
                    <div class="relative">
                        <span class="absolute inset-y-0 left-0 flex items-center pl-4 text-gray-400">
                            <i class="bi bi-person-fill"></i>
                        </span>
                        <input type="text"
                               name="username"
                               placeholder="Ingrese su usuario"
                               class="w-full pl-12 pr-4 py-3 border border-gray-300 rounded-xl focus:ring-2 focus:ring-indigo-500 focus:outline-none text-base">
                    </div>
                </div>

                <!-- Contraseña -->
                <div>
                    <label class="block text-base font-medium text-gray-700 mb-2">Contraseña</label>
                    <div class="relative">
                        <span class="absolute inset-y-0 left-0 flex items-center pl-4 text-gray-400">
                            <i class="bi bi-lock-fill"></i>
                        </span>
                        <input type="password"
                               name="password"
                               placeholder="Ingrese su contraseña"
                               class="w-full pl-12 pr-4 py-3 border border-gray-300 rounded-xl focus:ring-2 focus:ring-indigo-500 focus:outline-none text-base">
                    </div>
                </div>

                <!-- Botón -->
                <button type="submit"
                        class="w-full bg-indigo-600 hover:bg-indigo-700 text-white py-3 rounded-xl font-semibold transition duration-300 flex items-center justify-center gap-2 text-lg">
                    <i class="bi bi-box-arrow-in-right"></i>
                    Iniciar sesión
                </button>
            </form>

            <!-- Footer -->
            <div class="text-center mt-8 text-sm text-gray-400">
                © 2026 Minimarket · Proyecto académico
            </div>

        </div>
    </div>

    <!-- Validaciones SweetAlert2 -->
    <script>
        document.getElementById('loginForm').addEventListener('submit', function(event) {
            const username = this.username.value.trim();
            const password = this.password.value.trim();

            if (!username || !password) {
                event.preventDefault(); 
                Swal.fire({
                    icon: 'warning',
                    title: 'Campos requeridos',
                    text: !username && !password ? 'Ingrese usuario y contraseña' :
                          !username ? 'Ingrese su usuario' :
                          'Ingrese su contraseña',
                    confirmButtonColor: '#6366F1'
                });
            }
        });

        const urlParams = new URLSearchParams(window.location.search);
        if (urlParams.has('error')) {
            Swal.fire({
                icon: 'error',
                title: 'Error',
                text: 'Usuario o contraseña incorrectos',
                confirmButtonColor: '#6366F1'
            });
        }
    </script>

</body>
</html>
