<div th:fragment="contenido" class="space-y-6">

    <div class="flex justify-between items-center bg-white p-4 rounded-xl shadow-sm border border-gray-100">
        <div>
            <h1 class="text-3xl font-extrabold text-gray-800 tracking-tight">Terminal de Ventas</h1>
            <p class="text-gray-500 text-sm mt-1">Selecciona los productos para armar el ticket</p>
        </div>
        <div class="text-right">
            <p class="text-sm text-gray-500">Cajero ID: <span th:text="${usuarioId}" class="font-bold"></span></p>
        </div>
    </div>
	
    <input type="hidden" id="usuarioIdInput" th:value="${usuarioId}">
    <input type="hidden" id="csrfToken" th:value="${_csrf.token}">
    <input type="hidden" id="csrfHeader" th:value="${_csrf.headerName}">

    <div class="flex flex-col lg:flex-row gap-6">
        
        <div class="w-full lg:w-2/3 bg-white rounded-2xl shadow-xl p-5 border border-gray-100">
            <div class="mb-6">
                <div class="relative">
                    <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                        <svg class="h-5 w-5 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
                    </div>
                    <input type="text" id="buscarProducto" placeholder="Buscar producto por nombre o código..." onkeyup="filtrarProductos()"
                           class="w-full border border-gray-300 rounded-xl pl-10 pr-4 py-3 focus:outline-none focus:ring-2 focus:ring-blue-500 transition-all">
                </div>
            </div>

            <div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-4 h-[600px] overflow-y-auto pr-2" id="gridProductos">
                <div th:each="producto : ${productos}" th:if="${producto.activo}" class="producto-card bg-gray-50 rounded-xl border border-gray-200 overflow-hidden hover:shadow-md transition-shadow cursor-pointer flex flex-col"
                     th:attr="data-id=${producto.id}, data-nombre=${producto.nombre}, data-precio=${producto.precio}, data-stock=${producto.stockActual}"
                     onclick="agregarAlCarrito(this)">
                    
                    <div class="h-32 bg-white flex items-center justify-center p-2 border-b border-gray-100">
                        <img th:if="${producto.imagenUrl != null}" th:src="${producto.imagenUrl}" alt="Imagen" class="max-h-full object-contain">
                        <svg th:unless="${producto.imagenUrl != null}" class="w-12 h-12 text-gray-300" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"></path></svg>
                    </div>
                    
                    <div class="p-3 flex-grow flex flex-col justify-between">
                        <div>
                            <h3 class="text-sm font-bold text-gray-800 leading-tight producto-nombre" th:text="${producto.nombre}"></h3>
                            <p class="text-xs text-gray-500 mt-1">Stock: <span th:text="${producto.stockActual}" class="font-semibold text-blue-600"></span></p>
                        </div>
                        <div class="mt-2 flex justify-between items-center">
                            <span class="text-lg font-black text-green-600" th:text="'S/ ' + ${#numbers.formatDecimal(producto.precio, 1 , 2)}"></span>
                            <div class="bg-blue-600 text-white rounded-full p-1 hover:bg-blue-700">
                                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path></svg>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="w-full lg:w-1/3 bg-white rounded-2xl shadow-xl border border-gray-100 flex flex-col h-[700px]">
            <div class="bg-gray-800 text-white p-4 rounded-t-2xl flex justify-between items-center">
                <h2 class="text-xl font-bold">Ticket de Venta</h2>
                <span class="bg-red-500 text-white text-xs font-bold px-2 py-1 rounded cursor-pointer hover:bg-red-600" onclick="vaciarCarritoConfirmacion()">Vaciar</span>
            </div>
            
            <div class="flex-grow p-4 overflow-y-auto bg-gray-50" id="contenedorCarrito">
                <div id="carritoVacio" class="text-center text-gray-400 mt-10">
                    <svg class="w-16 h-16 mx-auto mb-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M3 3h2l.4 2M7 13h10l4-8H5.4M7 13L5.4 5M7 13l-2.293 2.293c-.63.63-.184 1.707.707 1.707H17m0 0a2 2 0 100 4 2 2 0 000-4zm-8 0a2 2 0 100 4 2 2 0 000-4z"></path></svg>
                    <p>El carrito está vacío</p>
                </div>
                <ul id="listaCarrito" class="space-y-3"></ul>
            </div>

            <div class="p-5 border-t border-gray-200 bg-white rounded-b-2xl shadow-[0_-4px_6px_-1px_rgba(0,0,0,0.05)]">
                <div class="flex justify-between items-center mb-4">
                    <span class="text-gray-600 font-semibold text-lg">Total a Pagar:</span>
                    <span class="text-3xl font-black text-green-600">S/ <span id="totalVenta">0.00</span></span>
                </div>
                <button type="button" onclick="procesarVenta()" id="btnCobrar" disabled
                        class="w-full bg-blue-600 disabled:bg-gray-300 hover:bg-blue-700 text-white py-4 rounded-xl font-bold text-xl uppercase tracking-wider transition-colors flex justify-center items-center gap-2">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 9V7a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2m2 4h10a2 2 0 002-2v-6a2 2 0 00-2-2H9a2 2 0 00-2 2v6a2 2 0 002 2zm7-5a2 2 0 11-4 0 2 2 0 014 0z"></path></svg>
                    Procesar Cobro
                </button>
            </div>
        </div>

    </div>

    <script src="/js/ventas.js"></script>

</div>
