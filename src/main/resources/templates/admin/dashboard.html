<div th:fragment="contenido">

    <div class="space-y-10">

        <!-- HEADER -->
        <div>
            <h1 class="text-3xl font-bold text-gray-800">
                Dashboard
            </h1>
            <p class="text-gray-500 mt-1">
                Resumen general del sistema
            </p>
        </div>

        <!-- KPIs -->
        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6">

            <div class="bg-white rounded-2xl shadow-lg p-6 flex justify-between items-center">
                <div>
                    <p class="text-gray-500">Productos</p>
                    <h2 class="text-3xl font-bold text-gray-800 mt-2">25</h2>
                </div>
                <div class="bg-blue-100 p-4 rounded-xl">
                    <i class="bi bi-box text-3xl text-blue-600"></i>
                </div>
            </div>

            <div class="bg-white rounded-2xl shadow-lg p-6 flex justify-between items-center">
                <div>
                    <p class="text-gray-500">Categorías</p>
                    <h2 class="text-3xl font-bold text-gray-800 mt-2">6</h2>
                </div>
                <div class="bg-green-100 p-4 rounded-xl">
                    <i class="bi bi-tags text-3xl text-green-600"></i>
                </div>
            </div>

            <div class="bg-white rounded-2xl shadow-lg p-6 flex justify-between items-center">
                <div>
                    <p class="text-gray-500">Ventas del Mes</p>
                    <h2 class="text-3xl font-bold text-gray-800 mt-2">S/ 1,250</h2>
                </div>
                <div class="bg-yellow-100 p-4 rounded-xl">
                    <i class="bi bi-currency-dollar text-3xl text-yellow-600"></i>
                </div>
            </div>

            <div class="bg-white rounded-2xl shadow-lg p-6 flex justify-between items-center">
                <div>
                    <p class="text-gray-500">Usuarios</p>
                    <h2 class="text-3xl font-bold text-gray-800 mt-2">12</h2>
                </div>
                <div class="bg-purple-100 p-4 rounded-xl">
                    <i class="bi bi-people-fill text-3xl text-purple-600"></i>
                </div>
            </div>

        </div>

        <!-- GRÁFICOS -->
        <div class="grid grid-cols-1 lg:grid-cols-2 gap-8">

            <!-- Ventas Mensuales -->
            <div class="bg-white rounded-2xl shadow-lg p-6">
                <h3 class="text-xl font-semibold text-gray-700 mb-4">
                    Ventas Mensuales
                </h3>
                <canvas id="salesChart"></canvas>
            </div>

            <!-- Productos Más Vendidos -->
            <div class="bg-white rounded-2xl shadow-lg p-6">
                <h3 class="text-xl font-semibold text-gray-700 mb-4">
                    Productos Más Vendidos
                </h3>
                <canvas id="productChart"></canvas>
            </div>

        </div>

        <!-- CATEGORÍAS + ACTIVIDAD -->
        <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">

            <!-- Categorías -->
            <div class="bg-white rounded-2xl shadow-lg p-6">
                <h3 class="text-xl font-semibold text-gray-700 mb-4">
                    Distribución por Categoría
                </h3>
                <canvas id="categoryChart"></canvas>
            </div>

            <!-- Actividad Reciente -->
            <div class="bg-white rounded-2xl shadow-lg p-6 lg:col-span-2">
                <h3 class="text-xl font-semibold text-gray-700 mb-6">
                    Actividad Reciente
                </h3>

                <div class="space-y-4">

                    <div class="flex items-center justify-between border-b pb-3">
                        <span class="text-gray-600">Nuevo producto agregado</span>
                        <span class="text-sm text-gray-400">Hace 2h</span>
                    </div>

                    <div class="flex items-center justify-between border-b pb-3">
                        <span class="text-gray-600">Venta registrada</span>
                        <span class="text-sm text-gray-400">Hace 4h</span>
                    </div>

                    <div class="flex items-center justify-between border-b pb-3">
                        <span class="text-gray-600">Nuevo usuario creado</span>
                        <span class="text-sm text-gray-400">Ayer</span>
                    </div>

                </div>

            </div>

        </div>

    </div>

</div>

<!-- Chart.js -->
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<script>
document.addEventListener("DOMContentLoaded", function () {

    // Ventas Mensuales
    new Chart(document.getElementById('salesChart'), {
        type: 'line',
        data: {
            labels: ['Ene','Feb','Mar','Abr','May','Jun'],
            datasets: [{
                data: [500, 800, 600, 900, 1200, 1500],
                borderColor: '#4f46e5',
                backgroundColor: 'rgba(79,70,229,0.1)',
                fill: true,
                tension: 0.4
            }]
        },
        options: {
            plugins: { legend: { display: false } }
        }
    });

    // Productos Más Vendidos
    new Chart(document.getElementById('productChart'), {
        type: 'bar',
        data: {
            labels: ['Arroz','Leche','Azúcar','Aceite'],
            datasets: [{
                data: [120, 95, 80, 60],
                backgroundColor: ['#3b82f6','#10b981','#f59e0b','#ef4444']
            }]
        },
        options: {
            plugins: { legend: { display: false } }
        }
    });

    // Categorías
    new Chart(document.getElementById('categoryChart'), {
        type: 'doughnut',
        data: {
            labels: ['Granos','Lácteos','Bebidas','Otros'],
            datasets: [{
                data: [40, 25, 20, 15],
                backgroundColor: ['#6366f1','#22c55e','#facc15','#f43f5e']
            }]
        }
    });

});
</script>
