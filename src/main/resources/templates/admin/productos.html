<div th:fragment="contenido" class="space-y-10">

    <!-- HEADER MEJORADO -->
    <div class="flex justify-between items-center">
        <div>
            <h1 class="text-4xl font-extrabold text-gray-900 tracking-tight">
                Gestión de Productos
            </h1>
            <p class="text-gray-600 text-lg mt-2">
                Administra los productos del sistema
            </p>
        </div>

		<!-- BOTÓN NUEVO PRODUCTO -->
		<button onclick="prepareCreate()"
		        class="bg-indigo-600 hover:bg-indigo-700 text-white px-6 py-3 rounded-xl shadow-lg transition font-semibold"
		        sec:authorize="hasRole('ADMIN')">
		    + Nuevo Producto
		</button>
    </div>

    <!-- TABLA -->
    <div class="bg-white rounded-2xl shadow-xl overflow-hidden">

        <table class="min-w-full divide-y divide-gray-200">

            <thead class="bg-gray-100">
            <tr>
                <th class="px-6 py-4 text-left text-sm font-bold text-gray-700 uppercase">ID</th>
                <th class="px-6 py-4 text-left text-sm font-bold text-gray-700 uppercase">Nombre</th>
                <th class="px-6 py-4 text-left text-sm font-bold text-gray-700 uppercase">Precio</th>
                <th class="px-6 py-4 text-left text-sm font-bold text-gray-700 uppercase">Stock</th>
                <th class="px-6 py-4 text-left text-sm font-bold text-gray-700 uppercase">Categoría</th>
				<th class="px-6 py-4 text-left text-sm font-bold text-gray-700 uppercase">Marca</th>
                <th class="px-6 py-4 text-center text-sm font-bold text-gray-700 uppercase">Imagen</th>
				<th class="px-6 py-4 text-center text-sm font-bold text-gray-700 uppercase"
				    sec:authorize="hasRole('ADMIN')">
				    Acciones
				</th>
            </tr>
            </thead>

            <tbody class="divide-y divide-gray-100">

            <!-- LISTADO REAL -->
            <tr th:each="producto : ${productos}" class="hover:bg-gray-50">

                <td class="px-6 py-4 font-medium"
                    th:text="${producto.id}">
                </td>

                <td class="px-6 py-4 font-semibold text-gray-800"
                    th:text="${producto.nombre}">
                </td>

                <td class="px-6 py-4 font-bold text-green-600"
                    th:text="'S/ ' + ${#numbers.formatDecimal(producto.precio, 1 , 2)}">
                </td>

                <td class="px-6 py-4">
                    <span class="bg-blue-100 text-blue-700 px-3 py-1 rounded-full text-sm font-semibold"
                          th:text="${producto.stockActual}">
                    </span>
                </td>

                <td class="px-6 py-4 text-gray-600 font-medium"
                    th:text="${producto.categoria !=null ? producto.categoria.nombre : 'Sin Categoría'}">
                </td>
				
				<td class="px-6 py-4 text-gray-600 font-medium"
				    th:text="${producto.marca !=null ? producto.marca.nombre : 'Sin Marca'}">
				 </td>

                <!-- IMAGEN AL FINAL -->
                <td class="px-6 py-4">
                    <img th:if="${producto.imagenUrl != null}"
                         th:src="@{${producto.imagenUrl}}"
                         class="w-14 h-14 min-w-full rounded-lg shadow object-contain">
                </td>

				<!-- BOTONES DE EDITAR Y ELIMINAR EN CADA FILA -->
				<td class="px-6 py-4 text-center space-x-2">

				    <button
				        th:attr="onclick=|prepareEdit(${producto.id}, '${producto.nombre}', ${producto.precio}, ${producto.stockActual},
				         ${producto.categoria != null ? producto.categoria.id : 0}
				         ,${producto.marca != null ? producto.marca.id : 0},'${producto.descripcion}','${producto.imagenUrl}')|"
				        class="bg-yellow-400 hover:bg-yellow-500 text-white px-4 py-2 rounded-lg text-sm font-semibold"
				        sec:authorize="hasRole('ADMIN')">
				        Editar
				    </button>

				    <button
				        th:attr="onclick=|confirmDelete(${producto.id})|"
				        class="bg-red-500 hover:bg-red-600 text-white px-4 py-2 rounded-lg text-sm font-semibold"
				        sec:authorize="hasRole('ADMIN')">
				        Eliminar
				    </button>

				</td>

            </tr>

            <!-- SI NO HAY PRODUCTOS -->
            <tr th:if="${#lists.isEmpty(productos)}">
                <td colspan="7" class="text-center py-10 text-gray-400 text-lg">
                    No hay productos registrados
                </td>
            </tr>

            </tbody>

        </table>
		
		<!-- MODAL -->
		<div id="productModal"
		     class="fixed inset-0 bg-black bg-opacity-50 hidden items-center justify-center">

		    <div class="bg-white rounded-xl shadow-xl w-full max-w-2xl p-6 mx-4 sm:mx-auto">

		        <h2 id="modalTitle" class="text-2xl font-bold mb-4">
		            Nuevo Producto
		        </h2>

		        <form id="productForm" novalidate th:action="@{/admin/productos/guardar}" method="post" enctype="multipart/form-data">

		            <input type="hidden" id="productId" name="id">

		            <div class="mb-3">
		                <label class="block font-semibold mb-1">Nombre</label>
		                <input type="text" id="nombre" name="nombre"
		                       class="w-full border rounded p-2">
		            </div>

		            <div class="mb-3">
		                <label class="block font-semibold mb-1">Precio</label>
		                <input type="number" id="precio" name="precio" step="0.01" min="0.01
						" required
		                       class="w-full border rounded p-2">
		            </div>

		            <div class="mb-3">
		                <label class="block font-semibold mb-1">Stock</label>
		                <input type="number" id="stockActual" name="stockActual"
		                       class="w-full border rounded p-2">
		            </div>

		            <div class="mb-3">
		                <label class="block font-semibold mb-1">Categoría</label>
		                <select id="categoria" name="categoria.id"
		                        class="w-full border rounded p-2">
		                    <option value="">Seleccione</option>
		                    <option th:each="cat : ${categorias}"
		                            th:value="${cat.id}"
		                            th:text="${cat.nombre}">
		                    </option>
		                </select>
		            </div>
					
					<div class="mb-3">
						 <label class="block font-semibold mb-1">Marca</label>
						  <select id="marca" name="marca.id"
						         class="w-full border rounded p-2">
						  <option value="">Seleccione</option>
						  <option th:each="mar : ${marcas}"
						          th:value="${mar.id}"
						          th:text="${mar.nombre}">
						   </option>
						   </select>
						 	 </div>
					 <div class="mb-3">
							 <label class="block font-semibold mb-1">Descripción</label>
							  <textarea id="descripcion"
							  name="descripcion"
							   rows="3"
							   class="w-11/12 border rounded p-2 mx auto block"
						   		style= "resize: none;"></textarea>
							 </div>
							 
					<div class="mb-3">
							<label class="block font-semibold mb-1">Imagen</label>
							<img id="imagenPreview"
							src=""
							alt="Imagen del Producto"
							class="w-14 h-14 roundend-lg shadow object-contain mb-2"
							style="display: none;">
							<input type="file"
							 id="imageFile"
							 name="imagenFile"
							 accept="image/*"
							  class="w-full border rounded p-2">
							 </div>		 		 
	
		            <div class="flex justify-end gap-3 mt-4">
		                <button type="button"
		                        onclick="closeModal()"
		                        class="bg-gray-400 text-white px-4 py-2 rounded">
		                    Cancelar
		                </button>

		                <button type="submit"
		                        class="bg-indigo-600 text-white px-4 py-2 rounded">
		                    Guardar
		                </button>
		            </div>

		        </form>

		    </div>
		</div>

    </div>
</div>
