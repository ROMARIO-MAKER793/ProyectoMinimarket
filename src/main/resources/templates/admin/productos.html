<div th:fragment="contenido" class="space-y-10">

    <!-- HEADER -->
    <div class="flex justify-between items-center">
        <div class="flex flex-col">
            <h1 class="text-4xl font-extrabold text-gray-900 tracking-tight flex items-center gap-2">
                <i class="bi bi-box-seam text-indigo-600"></i>
                Gestión de Productos
            </h1>
            <p class="text-gray-600 text-lg mt-2">
                Administra los productos del sistema
            </p>
        </div>

        <button onclick="prepareCreate()"
                class="bg-indigo-600 hover:bg-indigo-700 text-white px-6 py-3 rounded-xl shadow-lg transition font-semibold flex items-center gap-2"
                sec:authorize="hasRole('ADMIN')">
            <i class="bi bi-plus-lg"></i> Nuevo Producto
        </button>
    </div>

    <!-- TABLA -->
    <div class="bg-white rounded-2xl shadow-xl overflow-hidden">
        <table class="min-w-full divide-y divide-gray-200">
            <thead class="bg-gray-100">
                <tr>
                    <th class="px-6 py-4 text-left text-sm font-bold text-gray-700 uppercase">ID</th>
                    <th class="px-6 py-4 text-left text-sm font-bold text-gray-700 uppercase">Nombre</th>
                    <th class="px-6 py-4 text-left text-sm font-bold text-gray-700 uppercase">Precio</th>
                    <th class="px-6 py-4 text-left text-sm font-bold text-gray-700 uppercase">Stock</th>
                    <th class="px-6 py-4 text-left text-sm font-bold text-gray-700 uppercase">Categoría</th>
                    <th class="px-6 py-4 text-left text-sm font-bold text-gray-700 uppercase">Marca</th>
                    <th class="px-6 py-4 text-center text-sm font-bold text-gray-700 uppercase">Imagen</th>
                    <th class="px-6 py-4 text-center text-sm font-bold text-gray-700 uppercase" sec:authorize="hasRole('ADMIN')">Acciones</th>
                </tr>
            </thead>
            <tbody class="divide-y divide-gray-100">

				<tr th:each="producto : ${productos}" class="hover:bg-gray-50 min-h-[56px]">

				    <td class="px-6 py-4 font-medium align-middle" th:text="${producto.id}"></td>

				    <td class="px-6 py-4 font-semibold text-gray-800 align-middle">
				        <div class="flex items-center gap-2 h-full">
				            <i class="bi bi-box text-indigo-500"></i>
				            <span th:text="${producto.nombre}"></span>
				        </div>
				    </td>

				    <td class="px-6 py-4 font-bold text-green-600 align-middle" th:text="'S/ ' + ${#numbers.formatDecimal(producto.precio, 1 , 2)}"></td>

				    <td class="px-6 py-4 align-middle">
				        <span class="bg-blue-100 text-blue-700 px-3 py-1 rounded-full text-sm font-semibold" th:text="${producto.stockActual}"></span>
				    </td>

				    <td class="px-6 py-4 text-gray-600 font-medium align-middle" th:text="${producto.categoria !=null ? producto.categoria.nombre : 'Sin Categoría'}"></td>

				    <td class="px-6 py-4 text-gray-600 font-medium align-middle" th:text="${producto.marca !=null ? producto.marca.nombre : 'Sin Marca'}"></td>

				    <td class="px-6 py-4 text-center align-middle">
				        <img th:if="${producto.imagenUrl != null}" th:src="@{${producto.imagenUrl}}" class="w-14 h-14 rounded-lg shadow object-contain mx-auto">
				    </td>

				    <td class="px-6 py-4 align-middle">
				        <div class="flex justify-center items-center gap-2 h-full">
				            <button th:attr="onclick=|prepareEdit(${producto.id}, '${producto.nombre}', ${producto.precio}, ${producto.stockActual},
				                ${producto.categoria != null ? producto.categoria.id : 0}, ${producto.marca != null ? producto.marca.id : 0},
				                '${producto.descripcion}', '${producto.imagenUrl}')|"
				                class="bg-yellow-400 hover:bg-yellow-500 text-white px-4 py-2 rounded-lg text-sm font-semibold flex items-center gap-1">
				                <i class="bi bi-pencil-fill"></i> Editar
				            </button>
				            <button th:attr="onclick=|confirmDelete(${producto.id})|"
				                class="bg-red-500 hover:bg-red-600 text-white px-4 py-2 rounded-lg text-sm font-semibold flex items-center gap-1">
				                <i class="bi bi-trash-fill"></i> Eliminar
				            </button>
				        </div>
				    </td>
				</tr>

                <tr th:if="${#lists.isEmpty(productos)}">
                    <td colspan="8" class="text-center py-10 text-gray-400 text-lg">No hay productos registrados</td>
                </tr>

            </tbody>
        </table>

        <!-- MODAL -->
        <div id="productModal" class="fixed inset-0 bg-black bg-opacity-50 hidden items-center justify-center z-50">
            <div class="bg-white rounded-xl shadow-xl w-full max-w-2xl p-6 mx-4 sm:mx-auto">
                <h2 id="modalTitle" class="text-2xl font-bold mb-4 flex items-center gap-2">
                    <i class="bi bi-box-seam text-indigo-600"></i>
                    Nuevo Producto
                </h2>

                <form id="productForm" novalidate th:action="@{/admin/productos/guardar}" method="post" enctype="multipart/form-data">
                    <input type="hidden" id="productId" name="id">

                    <div class="mb-3">
                        <label class="block font-semibold mb-1">Nombre</label>
                        <input type="text" id="nombre" name="nombre" class="w-full border rounded p-2" placeholder="Ingrese nombre">
                    </div>

                    <div class="mb-3">
                        <label class="block font-semibold mb-1">Precio</label>
                        <input type="number" id="precio" name="precio" step="0.01" min="0.01" class="w-full border rounded p-2" placeholder="S/ 0.00">
                    </div>

                    <div class="mb-3">
                        <label class="block font-semibold mb-1">Stock</label>
                        <input type="number" id="stockActual" name="stockActual" class="w-full border rounded p-2" placeholder="20">
                    </div>

                    <div class="mb-3">
                        <label class="block font-semibold mb-1">Categoría</label>
                        <select id="categoria" name="categoria.id" class="w-full border rounded p-2">
                            <option value="">Seleccione</option>
                            <option th:each="cat : ${categorias}" th:value="${cat.id}" th:text="${cat.nombre}"></option>
                        </select>
                    </div>

                    <div class="mb-3">
                        <label class="block font-semibold mb-1">Marca</label>
                        <select id="marca" name="marca.id" class="w-full border rounded p-2">
                            <option value="">Seleccione</option>
                            <option th:each="mar : ${marcas}" th:value="${mar.id}" th:text="${mar.nombre}"></option>
                        </select>
                    </div>

                    <div class="mb-3">
                        <label class="block font-semibold mb-1">Descripción</label>
                        <textarea id="descripcion" name="descripcion" rows="3" class="w-full border rounded p-2 resize-none" placeholder="Descripción del producto"></textarea>
                    </div>

                    <div class="mb-3">
                        <label class="block font-semibold mb-1">Imagen</label>
                        <img id="imagenPreview" src="" alt="Imagen del Producto" class="w-20 h-20 rounded-lg shadow object-contain mb-2 hidden">
                        <input type="file" id="imageFile" name="imagenFile" accept="image/*" class="w-full border rounded p-2">
                    </div>

                    <div class="flex justify-end gap-3 mt-4">
                        <button type="button" onclick="closeModal()" class="bg-gray-400 text-white px-4 py-2 rounded flex items-center gap-1">
                            <i class="bi bi-x-lg"></i> Cancelar
                        </button>
                        <button type="submit" class="bg-indigo-600 text-white px-4 py-2 rounded flex items-center gap-1">
                            <i class="bi bi-check-lg"></i> Guardar
                        </button>
                    </div>
                </form>
            </div>
        </div>

        <script src="/js/productos.js"></script>
    </div>
</div>
